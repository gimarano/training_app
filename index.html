<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gianni 5">
<meta name="theme-color" content="#0E1417">
<title>Gianni 5 — Forza &amp; VO2max</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E1417;
  --surface:#182126;
  --surface2:#1F2B31;
  --line:#2B3A41;
  --text:#E6EDEF;
  --muted:#8AA0A8;
  --strength:#8E7BF0;
  --aero:#2BB3B8;
  --warn:#D9A441;
  --ok:#5BC98C;
  --r:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg)}
body{
  font-family:'Archivo',system-ui,-apple-system,sans-serif;
  color:var(--text);font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(74px + env(safe-area-inset-bottom));
}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.wrap{max-width:660px;margin:0 auto;padding:0 16px}

/* top */
.top{
  position:sticky;top:0;z-index:20;background:rgba(14,20,23,.94);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
.top .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0 11px}
.brand{font-size:14px;font-weight:800;letter-spacing:.06em;font-variation-settings:'wdth' 100}
.brand em{font-style:normal;color:var(--muted);font-weight:500}
.wknav{display:flex;align-items:center;gap:2px}
.wknav button{
  width:30px;height:30px;border:1px solid var(--line);background:var(--surface);
  color:var(--text);border-radius:8px;font-size:16px;line-height:1;cursor:pointer;
}
.wknav button:disabled{opacity:.3;cursor:default}
.wknav .lbl{min-width:62px;text-align:center;font-size:13px;font-weight:700}
.wknav .lbl small{display:block;font-size:10px;color:var(--muted);font-weight:500;letter-spacing:.04em}

/* tabs */
.tabs{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{
  background:none;border:none;padding:0 0 10px;color:var(--muted);
  font-family:inherit;font-size:12.5px;font-weight:700;letter-spacing:.09em;
  cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;
}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--strength)}

main{padding-top:20px}
section[hidden]{display:none}
h2.head{font-size:22px;font-weight:750;margin:0 0 3px;font-variation-settings:'wdth' 108}
p.sub{margin:0 0 18px;color:var(--muted);font-size:14px}

/* progress bar */
.pbar{height:4px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:0 0 4px}
.pbar i{display:block;height:100%;background:var(--ok);width:0;transition:width .25s ease}
.pmeta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:18px}

/* card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin-bottom:12px}
.card h3{margin:0 0 2px;font-size:17px;font-weight:700}
.card .cmeta{color:var(--muted);font-size:13px;margin:0 0 12px}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.05em;vertical-align:2px;margin-left:7px}
.pill.s{background:rgba(142,123,240,.16);color:var(--strength)}
.pill.a{background:rgba(43,179,184,.16);color:var(--aero)}
.pill.w{background:rgba(217,164,65,.16);color:var(--warn)}

/* exercise row */
.exr{display:grid;grid-template-columns:26px 1fr 82px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.exr:first-of-type{border-top:none}
.exr .nm{font-size:15px;font-weight:600;line-height:1.25}
.exr .hint{font-size:12.5px;color:var(--muted);margin-top:2px}
.exr .tgt{font-size:12.5px;color:var(--strength);margin-top:3px}
.exr.aero .tgt{color:var(--aero)}
.chk{
  width:24px;height:24px;border-radius:7px;border:1px solid var(--line);
  background:var(--surface2);cursor:pointer;padding:0;color:var(--bg);
  font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;
}
.chk[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
input.load{
  width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:8px;
  color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:14px;
  padding:7px 8px;text-align:center;
}
input.load::placeholder{color:#5C7078}
input.load:focus,.chk:focus-visible,button:focus-visible{outline:2px solid var(--strength);outline-offset:2px}

.btn{
  width:100%;padding:13px;border-radius:9px;border:none;cursor:pointer;
  font-family:inherit;font-size:15px;font-weight:700;background:var(--strength);color:#12101F;
}
.btn.ghost{background:var(--surface);color:var(--text);border:1px solid var(--line);font-weight:600}
.btn.sm{width:auto;padding:8px 13px;font-size:13px}

.note{background:var(--surface2);border-left:2px solid var(--line);padding:10px 12px;border-radius:0 6px 6px 0;font-size:13.5px;color:var(--muted);margin-top:12px}
.note b{color:var(--text);font-weight:600}

/* plan */
.rail{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 14px}
.rail::-webkit-scrollbar{display:none}
.rail button{
  flex:0 0 auto;width:44px;height:50px;border-radius:9px;border:1px solid var(--line);
  background:var(--surface);color:var(--muted);font-family:inherit;font-size:15px;font-weight:700;
  display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;
}
.rail button span{font-size:9px;letter-spacing:.05em;font-weight:600;margin-top:2px}
.rail button[aria-pressed="true"]{background:var(--strength);border-color:var(--strength);color:#12101F}
.rail button[aria-pressed="true"] span{color:#12101F}

.dayrow{display:grid;grid-template-columns:38px 1fr auto;gap:11px;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--line)}
.dayrow .dw{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.06em}
.dayrow .dn{font-size:15.5px;font-weight:650}
.dayrow .dd{font-size:12.5px;color:var(--muted);margin-top:2px}
.dayrow .dt{font-size:12.5px;color:var(--muted);white-space:nowrap}
.dayrow.s .dn{color:var(--strength)}
.dayrow.a .dn{color:var(--aero)}
.dayrow.r{opacity:.45}

.legend{display:grid;gap:9px;margin-top:4px}
.legend div{font-size:13.5px;color:var(--muted)}
.legend code{background:var(--surface2);border:1px solid var(--line);border-radius:5px;padding:2px 6px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--text);margin-right:8px}

/* history */
.hitem{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;margin-bottom:10px}
.hitem .hh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.hitem .hd{font-size:12.5px;color:var(--muted)}
.hitem ul{margin:9px 0 0;padding:0;list-style:none;font-size:13.5px;color:var(--muted)}
.hitem li{display:flex;justify-content:space-between;gap:12px;padding:3px 0}
.hitem li b{color:var(--text);font-weight:600;font-family:'IBM Plex Mono',monospace;font-size:13px}

/* stats */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 12px;text-align:center}
.stat b{display:block;font-size:26px;font-weight:800;line-height:1.1;font-variation-settings:'wdth' 95}
.stat span{font-size:11.5px;color:var(--muted)}
.metin{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:11px}
.metin label{font-size:11.5px;color:var(--muted);display:block;margin-bottom:4px}

.empty{color:var(--muted);font-size:14px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:22px 16px;text-align:center}
svg.chart{width:100%;height:auto;display:block}
.chkey{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.chkey i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px}

/* bottom nav */
.bnav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:rgba(14,20,23,.95);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);display:flex;
  padding-bottom:env(safe-area-inset-bottom);
}
.bnav button{
  flex:1;background:none;border:none;padding:11px 4px 12px;cursor:pointer;
  color:var(--muted);font-family:inherit;font-size:10.5px;font-weight:700;letter-spacing:.07em;
}
.bnav button b{display:block;font-size:17px;font-weight:400;margin-bottom:2px;line-height:1}
.bnav button[aria-selected="true"]{color:var(--strength)}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:88px;z-index:40;
  background:var(--ok);color:#0B1A12;font-size:14px;font-weight:700;
  padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .2s
}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="row">
      <div class="brand">GIANNI 5 <em>/ FORZA · VO2MAX</em></div>
      <div class="wknav">
        <button id="wprev" type="button" aria-label="Settimana precedente">−</button>
        <div class="lbl" id="wlbl">W1/13<small>RICOSTRUZIONE</small></div>
        <button id="wnext" type="button" aria-label="Settimana successiva">+</button>
      </div>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="oggi" aria-selected="true">OGGI</button>
      <button role="tab" data-tab="piano" aria-selected="false">PIANO</button>
      <button role="tab" data-tab="storico" aria-selected="false">STORICO</button>
      <button role="tab" data-tab="progressi" aria-selected="false">PROGRESSI</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section id="tab-oggi"></section>
  <section id="tab-piano" hidden></section>
  <section id="tab-storico" hidden></section>
  <section id="tab-progressi" hidden></section>
</main>

<nav class="bnav" role="tablist">
  <button role="tab" data-tab="oggi" aria-selected="true"><b>◉</b>OGGI</button>
  <button role="tab" data-tab="piano" aria-selected="false"><b>▤</b>PIANO</button>
  <button role="tab" data-tab="storico" aria-selected="false"><b>↺</b>STORICO</button>
  <button role="tab" data-tab="progressi" aria-selected="false"><b>◹</b>PROGRESSI</button>
</nav>

<div class="toast" id="toast"></div>

<script>
"use strict";

/* ---------- storage: window.storage → localStorage → memoria ---------- */
const mem = {};
const store = {
  async get(k){
    try{ if(window.storage){ const r = await window.storage.get(k,false); return r? JSON.parse(r.value):null; } }catch(e){}
    try{ const v = localStorage.getItem(k); return v? JSON.parse(v):null; }catch(e){}
    return mem[k] ?? null;
  },
  async set(k,v){
    mem[k]=v;
    try{ if(window.storage){ await window.storage.set(k, JSON.stringify(v), false); return; } }catch(e){}
    try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){}
  }
};
const K_SESS='g5:sessions', K_MET='g5:metrics', K_WEEK='g5:week';

/* ---------- programma ---------- */
const MAIN={
  1:{s:4,r:'8',pct:'70%'},2:{s:4,r:'7',pct:'73%'},3:{s:4,r:'6',pct:'76%'},4:{s:3,r:'6',pct:'65%'},
  5:{s:5,r:'5',pct:'80%'},6:{s:5,r:'5',pct:'82%'},7:{s:4,r:'4',pct:'86%'},8:{s:3,r:'4',pct:'72%'},
  9:{s:4,r:'4',pct:'85%'},10:{s:4,r:'3',pct:'88%'},11:{s:4,r:'3',pct:'91%'},12:{s:3,r:'3',pct:'75%'},
  13:{s:2,r:'3',pct:'80%'}
};
const ACC={1:'3×10',2:'3×10',3:'3×8',4:'2×10',5:'3×8',6:'3×8',7:'3×8',8:'2×8',9:'3×6',10:'3×6',11:'2×6',12:'2×8',13:'2×8'};
const REC={1:'2\'',2:'2\'',3:'2\'30"',4:'2\'',5:'3\'',6:'3\'',7:'3\'',8:'2\'30"',9:'3\'',10:'3\'30"',11:'3\'30"',12:'2\'30"',13:'3\''};
const RPE={1:'RPE 7',2:'RPE 7',3:'RPE 8',4:'RPE 6',5:'RPE 8',6:'RPE 8',7:'RPE 9',8:'RPE 6',9:'RPE 8',10:'RPE 9',11:'RPE 9',12:'RPE 6',13:'—'};

const VO2={
  1:['8 × 1\' forte / 1\' rec.','Forte = ritmo tenibile 6-8\', non sprint.'],
  2:['10 × 1\' forte / 1\' rec.','Stessa intensità, due ripetute in più.'],
  3:['2 × (10 × 30"/30"), 4\' tra i blocchi','Recupero camminando.'],
  4:['6 × 1\' forte / 1\' rec.','Scarico: qualità uguale, volume dimezzato.'],
  5:['4 × 4\' al 90-95% FCmax, rec. 3\'','I primi 60" sembrano facili. Non partire troppo forte.'],
  6:['5 × 3\', rec. 2\'30"','Ritmo un filo più alto dei 4\'.'],
  7:['4 × 4\', rec. 2\'30"','Come W5 con 30" di recupero in meno.'],
  8:['3 × 4\', rec. 3\'','Scarico.'],
  9:['5 × 3\', rec. 2\'','Confronta il passo medio con W6.'],
  10:['2 × (10 × 30"/15"), rec. 3\'','Billat. Recupero corto, resta in piedi.'],
  11:['6 × 2\', rec. 90"','La settimana più dura del blocco.'],
  12:['4 × 2\', rec. 2\'','Scarico, gambe fresche per il test.'],
  13:['Test 12\' Cooper','Stessa pista e stesse condizioni del test iniziale.']
};
const LONG={
  1:['80\' Z2','Ritmo da conversazione.'],2:['90\' Z2',''],3:['100\' Z2',''],4:['60\' Z2','Scarico.'],
  5:['100\' Z2',''],6:['110\' con 2 × 15\' medio',''],7:['120\' con 2 × 15\' medio',''],8:['75\' Z2','Scarico.'],
  9:['110\' con 20\' soglia',''],10:['120\' con 2 × 15\' soglia',''],11:['120\' con 30\' soglia',''],
  12:['75\' Z2','Scarico.'],13:['60\' facile','Nessuna qualità: il test è giovedì.']
};

const mainT = w => MAIN[w].s+'×'+MAIN[w].r+' @ '+MAIN[w].pct+' · '+REC[w]+' · '+RPE[w];

function sessions(w){
  return {
    A:{id:'A',dow:'LUN',kind:'s',name:'Workout A',sub:'Spinta + core · 55\'',
      ex:[
        {id:'panca',nm:'Panca piana',hint:'Recuperi pieni, scapole bloccate',tgt:mainT(w),key:1},
        {id:'military',nm:'Military press',hint:'In piedi, senza spinta di gambe',tgt:ACC[w]+' · 90"'},
        {id:'dip',nm:'Dip o piegamenti zavorrati',hint:'Aggiungi peso quando chiudi tutte le serie',tgt:ACC[w]+' · 90"'},
        {id:'abwheel',nm:'Ab wheel',hint:'Lombare neutra, niente inarcamento',tgt:'3×10'},
        {id:'plank',nm:'Plank laterale',hint:'45" per lato',tgt:'3'}
      ],
      note:'Superserie fra gli accessori per stare nell\'ora di pausa pranzo.'},
    B:{id:'B',dow:'MAR',kind:'s',name:'Workout B',sub:'Squat + gambe · 55\'',
      ex:[
        {id:'squat',nm:'Back squat',hint:'Prima 2 serie leggere di pause squat',tgt:mainT(w),key:1},
        {id:'bulgari',nm:'Affondi bulgari',hint:'Per gamba',tgt:ACC[w]+' · 90"'},
        {id:'legcurl',nm:'Leg curl o nordic curl',hint:'',tgt:ACC[w]+' · 90"'},
        {id:'polpacci',nm:'Polpacci in piedi',hint:'1" di pausa in allungamento',tgt:'3×12'},
        {id:'caviglia',nm:'Mobilità caviglia',hint:'Ginocchio al muro, 2×10 per lato',tgt:'riscald.'}
      ],
      note:'Busto che si chiude in avanti e talloni che si staccano: si correggono qui, con mobilità di caviglia in riscaldamento e pause squat come prima cosa.'},
    V:{id:'V',dow:'GIO',kind:'a',name:'VO2max',sub:'Intervalli · 50\'',
      ex:[
        {id:'warm',nm:'Riscaldamento',hint:'15\' progressivi + 3 allunghi',tgt:'15\''},
        {id:'work',nm:VO2[w][0],hint:VO2[w][1],tgt:'90-95% FCmax',aero:1},
        {id:'cool',nm:'Defaticamento',hint:'Molto lento',tgt:'10\''}
      ],
      log:[{id:'fcmed',nm:'FC media lavoro',unit:'bpm'},{id:'passo',nm:'Passo medio ripetute',unit:'min/km'}],
      note:'È l\'unica seduta davvero intensa della settimana. Se arrivi stanco spostala al mercoledì invece di ridurla.'},
    C:{id:'C',dow:'VEN',kind:'s',name:'Workout C',sub:'Stacco + tirata · 55\'',
      ex:[
        {id:'stacco',nm:'Stacco da terra',hint:'Serie singole, riparti da fermo ogni rep',tgt:mainT(w),key:1},
        {id:'rematore',nm:'Rematore con bilanciere',hint:'',tgt:ACC[w]+' · 90"'},
        {id:'trazioni',nm:'Trazioni',hint:'Zavorrate se chiudi 8 pulite',tgt:ACC[w]+' · 90"'},
        {id:'facepull',nm:'Face pull',hint:'',tgt:'3×15'},
        {id:'farmer',nm:'Farmer\'s carry',hint:'40 m per serie',tgt:'3'}
      ],
      note:'Giovedì hai fatto intervalli: se i femorali sono ancora carichi togli il 5% allo stacco, non saltare la seduta.'},
    L:{id:'L',dow:'DOM',kind:'a',name:'Lungo aerobico',sub:'Bici o corsa',
      ex:[{id:'lungo',nm:LONG[w][0],hint:LONG[w][1],tgt:'Z2',aero:1}],
      log:[{id:'durata',nm:'Durata',unit:'min'},{id:'fcmed',nm:'FC media',unit:'bpm'}],
      note:'Tienilo davvero facile dove è scritto Z2. Se scivola in zona grigia perdi sia il recupero sia lo stimolo del giovedì.'}
  };
}

const WEEKPLAN=[
  {dow:'LUN',s:'A'},{dow:'MAR',s:'B'},{dow:'MER',s:null,nm:'Mobilità',dd:'Recupero attivo · 20\' (facoltativo)'},
  {dow:'GIO',s:'V'},{dow:'VEN',s:'C'},{dow:'SAB',s:null,nm:'Riposo',dd:'Riposo completo'},{dow:'DOM',s:'L'}
];
const DOWMAP={1:'LUN',2:'MAR',3:'MER',4:'GIO',5:'VEN',6:'SAB',0:'DOM'};

const PHASE = w => w<=4?0 : w<=8?1 : w<=12?2 : 3;
const PHASE_NAME=['RICOSTRUZIONE','FORZA','PICCO','TEST'];
const PHASE_DESC=[
  'Riadattamento e tecnica. Serie lunghe, carichi moderati, intervalli brevi.',
  'Forza vera in palestra, 4 × 4\' in pista. Il cuore del blocco.',
  'Carichi alti e volume basso. Frazionato corto e veloce.',
  'Test di forza e test aerobico. Nient\'altro.'
];
const isDeload = w => w===4||w===8||w===12;

/* ---------- stato ---------- */
let week=1, tab='oggi', planWeek=1, draft={}, SESS=[], MET=[];

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'),1800);
}

/* ---------- OGGI ---------- */
function todaySession(){
  const dow=DOWMAP[new Date().getDay()];
  const slot=WEEKPLAN.find(d=>d.dow===dow);
  return slot && slot.s ? sessions(week)[slot.s] : null;
}

function renderOggi(){
  const el=$('#tab-oggi');
  const s=todaySession();
  const dow=DOWMAP[new Date().getDay()];
  if(!s){
    const slot=WEEKPLAN.find(d=>d.dow===dow);
    el.innerHTML=`<h2 class="head">${esc(slot.nm)}</h2><p class="sub">${esc(slot.dd)}</p>
      <div class="empty">Nessuna seduta in programma oggi.<br>La prossima è ${esc(nextLabel(dow))}.</div>`;
    return;
  }
  const d=draft[s.id]||{done:{},load:{},log:{}};
  const total=s.ex.length;
  const done=Object.values(d.done).filter(Boolean).length;
  const pct=Math.round(done/total*100);

  const rows=s.ex.map(e=>`
    <div class="exr ${e.aero?'aero':''}">
      <button class="chk" type="button" data-done="${e.id}" aria-pressed="${!!d.done[e.id]}" aria-label="Completato">${d.done[e.id]?'✓':''}</button>
      <div>
        <div class="nm">${esc(e.nm)}</div>
        ${e.hint?`<div class="hint">${esc(e.hint)}</div>`:''}
        <div class="tgt mono">${esc(e.tgt)}</div>
      </div>
      ${e.aero?'<div></div>':`<input class="load" inputmode="decimal" placeholder="kg" data-load="${e.id}" value="${d.load[e.id]??''}">`}
    </div>`).join('');

  const logs=(s.log||[]).map(l=>`
    <div class="exr">
      <div></div>
      <div><div class="nm">${esc(l.nm)}</div><div class="hint">${esc(l.unit)}</div></div>
      <input class="load" inputmode="decimal" placeholder="${esc(l.unit)}" data-log="${l.id}" value="${d.log[l.id]??''}">
    </div>`).join('');

  el.innerHTML=`
    <h2 class="head">${esc(s.name)}<span class="pill ${s.kind}">${s.kind==='s'?'FORZA':'AEROBICO'}</span></h2>
    <p class="sub">${esc(s.sub)} · Settimana ${week}${isDeload(week)?' · scarico':''}</p>
    <div class="pbar"><i style="width:${pct}%"></i></div>
    <div class="pmeta"><span>Completati ${pct}%</span><span>${done}/${total}</span></div>
    <div class="card">${rows}${logs}<div class="note">${esc(s.note)}</div></div>
    <button class="btn" id="save">Salva sessione</button>`;

  el.querySelectorAll('[data-done]').forEach(b=>b.addEventListener('click',()=>{
    const id=b.dataset.done;
    draft[s.id]=draft[s.id]||{done:{},load:{},log:{}};
    draft[s.id].done[id]=!draft[s.id].done[id];
    renderOggi();
  }));
  el.querySelectorAll('[data-load]').forEach(i=>i.addEventListener('input',()=>{
    draft[s.id]=draft[s.id]||{done:{},load:{},log:{}};
    draft[s.id].load[i.dataset.load]=i.value;
  }));
  el.querySelectorAll('[data-log]').forEach(i=>i.addEventListener('input',()=>{
    draft[s.id]=draft[s.id]||{done:{},load:{},log:{}};
    draft[s.id].log[i.dataset.log]=i.value;
  }));
  $('#save').addEventListener('click',()=>saveSession(s));
}

function nextLabel(dow){
  const order=WEEKPLAN.map(d=>d.dow);
  let i=order.indexOf(dow);
  for(let n=1;n<=7;n++){
    const slot=WEEKPLAN[(i+n)%7];
    if(slot.s) return slot.dow+' · '+sessions(week)[slot.s].name;
  }
  return '';
}

async function saveSession(s){
  const d=draft[s.id]||{done:{},load:{},log:{}};
  const items=s.ex.map(e=>({id:e.id,nm:e.nm,key:!!e.key,done:!!d.done[e.id],load:parseFloat(d.load[e.id])||null}));
  const rec={
    ts:Date.now(), week, id:s.id, name:s.name, kind:s.kind,
    pct:Math.round(items.filter(i=>i.done).length/items.length*100),
    volume: s.kind==='s' ? items.reduce((a,i)=>a+(i.load? i.load*MAIN[week].s*parseInt(MAIN[week].r,10):0),0) : 0,
    items,
    log:Object.fromEntries(Object.entries(d.log||{}).map(([k,v])=>[k,parseFloat(v)||null]))
  };
  SESS.push(rec);
  await store.set(K_SESS,SESS);
  draft[s.id]={done:{},load:{},log:{}};
  toast('Sessione salvata');
  renderOggi(); renderStorico(); renderProgressi();
}

/* ---------- PIANO ---------- */
function renderPiano(){
  const el=$('#tab-piano');
  const S=sessions(planWeek);
  const rail=Array.from({length:13},(_,i)=>{
    const w=i+1;
    return `<button type="button" data-w="${w}" aria-pressed="${w===planWeek}">${w}${isDeload(w)?'<span>SCAR</span>':(w===13?'<span>TEST</span>':'')}</button>`;
  }).join('');

  const days=WEEKPLAN.map(d=>{
    if(!d.s) return `<div class="dayrow r"><div class="dw">${d.dow}</div><div><div class="dn">${esc(d.nm)}</div><div class="dd">${esc(d.dd)}</div></div><div class="dt"></div></div>`;
    const s=S[d.s];
    const detail = s.kind==='s' ? mainT(planWeek) : s.ex.find(e=>e.aero).nm;
    return `<div class="dayrow ${s.kind}"><div class="dw">${d.dow}</div>
      <div><div class="dn">${esc(s.name)}</div><div class="dd">${esc(s.sub)}</div><div class="dd mono">${esc(detail)}</div></div>
      <div class="dt"></div></div>`;
  }).join('');

  el.innerHTML=`
    <h2 class="head">Mesociclo · 13 settimane</h2>
    <p class="sub">Tre blocchi da quattro settimane più una di test. Scarico in W4, W8 e W12.</p>
    <div class="rail">${rail}</div>
    <div class="card">
      <h3>Settimana ${planWeek} · ${PHASE_NAME[PHASE(planWeek)]}${isDeload(planWeek)?'<span class="pill w">SCARICO</span>':''}</h3>
      <p class="cmeta">${esc(PHASE_DESC[PHASE(planWeek)])}</p>
      ${days}
      <div class="note"><b>Squat il martedì, stacco il venerdì.</b> Mai su giorni consecutivi, e il sabato resta libero.</div>
    </div>
    <div class="card">
      <h3>Progressione</h3>
      <p class="cmeta">Fondamentali: serie × rip @ % del massimale.</p>
      <div class="legend">
        <div><code>W1-4</code>4×8 al 70% fino a 4×6 al 76%, poi scarico</div>
        <div><code>W5-8</code>5×5 all'80-82%, 4×4 all'86%, poi scarico</div>
        <div><code>W9-12</code>4×4 all'85% fino a 4×3 al 91%, poi scarico</div>
        <div><code>W13</code>test di forza e Cooper 12'</div>
      </div>
    </div>
    <div class="card">
      <h3>Legenda</h3>
      <div class="legend">
        <div><code>4×8</code>4 serie da 8 ripetizioni</div>
        <div><code>@ 80%</code>percentuale del massimale stimato</div>
        <div><code>RPE 8</code>sforzo 8/10, due ripetizioni in riserva</div>
        <div><code>3'</code>recupero tra le serie</div>
        <div><code>Z2</code>~70-80% FCmax, ritmo da conversazione</div>
        <div><code>90-95%</code>intensità delle ripetute su FCmax</div>
      </div>
    </div>`;
  el.querySelectorAll('[data-w]').forEach(b=>b.addEventListener('click',()=>{planWeek=+b.dataset.w;renderPiano();}));
}

/* ---------- STORICO ---------- */
function renderStorico(){
  const el=$('#tab-storico');
  if(!SESS.length){ el.innerHTML=`<h2 class="head">Storico</h2><p class="sub">Le sessioni salvate finiscono qui.</p><div class="empty">Ancora nessuna sessione. Salvane una dalla scheda Oggi.</div>`; return; }
  const list=[...SESS].sort((a,b)=>b.ts-a.ts).map((r,i)=>{
    const dt=new Date(r.ts).toLocaleDateString('it-IT',{day:'2-digit',month:'short'});
    const rows=r.items.filter(x=>x.load).map(x=>`<li><span>${esc(x.nm)}</span><b>${x.load} kg</b></li>`).join('')
      || Object.entries(r.log||{}).filter(([,v])=>v).map(([k,v])=>`<li><span>${esc(k)}</span><b>${v}</b></li>`).join('');
    return `<div class="hitem">
      <div class="hh"><div><b>${esc(r.name)}</b><span class="pill ${r.kind}">W${r.week}</span></div><div class="hd">${dt} · ${r.pct}%</div></div>
      <ul>${rows}</ul>
      <div style="margin-top:10px"><button class="btn ghost sm" data-del="${r.ts}" type="button">Elimina</button></div>
    </div>`;
  }).join('');
  el.innerHTML=`<h2 class="head">Storico</h2><p class="sub">${SESS.length} sessioni salvate.</p>${list}`;
  el.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',async()=>{
    SESS=SESS.filter(x=>x.ts!==+b.dataset.del);
    await store.set(K_SESS,SESS);
    renderStorico(); renderProgressi();
  }));
}

/* ---------- grafici ---------- */
function lineChart(series,opts){
  const W=320,H=140,P={t:10,r:8,b:20,l:30};
  const all=series.flatMap(s=>s.pts.map(p=>p.y));
  if(!all.length) return '';
  let min=Math.min(...all), max=Math.max(...all);
  if(min===max){min-=1;max+=1;}
  const pad=(max-min)*.12; min-=pad; max+=pad;
  const n=Math.max(...series.map(s=>s.pts.length));
  const X=i=>P.l+(n<2?0:i*(W-P.l-P.r)/(n-1));
  const Y=v=>P.t+(max-v)/(max-min)*(H-P.t-P.b);
  const grid=[0,.5,1].map(f=>{const v=min+(max-min)*f;const y=Y(v);
    return `<line x1="${P.l}" y1="${y}" x2="${W-P.r}" y2="${y}" stroke="#2B3A41" stroke-width="1"/>
      <text x="2" y="${y+3.5}" fill="#8AA0A8" font-size="9">${v.toFixed(opts&&opts.dec?opts.dec:0)}</text>`;}).join('');
  const paths=series.map(s=>{
    const d=s.pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');
    const dots=s.pts.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="2.6" fill="${s.color}"/>`).join('');
    return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${dots}`;
  }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${grid}${paths}</svg>`;
}
function barChart(labels,values,color){
  const W=320,H=140,P={t:10,r:8,b:22,l:30};
  if(!values.length) return '';
  const max=Math.max(...values,1);
  const bw=(W-P.l-P.r)/values.length;
  const bars=values.map((v,i)=>{
    const h=(v/max)*(H-P.t-P.b);
    return `<rect x="${(P.l+i*bw+bw*.18).toFixed(1)}" y="${(H-P.b-h).toFixed(1)}" width="${(bw*.64).toFixed(1)}" height="${h.toFixed(1)}" fill="${color}" rx="2"/>
      <text x="${(P.l+i*bw+bw/2).toFixed(1)}" y="${H-7}" fill="#8AA0A8" font-size="9" text-anchor="middle">${esc(labels[i])}</text>`;
  }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">
    <line x1="${P.l}" y1="${H-P.b}" x2="${W-P.r}" y2="${H-P.b}" stroke="#2B3A41"/>
    <text x="2" y="${P.t+6}" fill="#8AA0A8" font-size="9">${Math.round(max)}</text>${bars}</svg>`;
}

/* ---------- PROGRESSI ---------- */
function renderProgressi(){
  const el=$('#tab-progressi');
  const now=new Date(); const monday=new Date(now); monday.setHours(0,0,0,0);
  monday.setDate(monday.getDate()-((now.getDay()+6)%7));
  const thisWeek=SESS.filter(s=>s.ts>=monday.getTime()).length;
  const last4=SESS.filter(s=>s.ts>=Date.now()-28*864e5).length;
  const aderenza=Math.min(100,Math.round(last4/20*100));

  const keyIds=['squat','panca','stacco'];
  const keyColors={squat:'#8E7BF0',panca:'#2BB3B8',stacco:'#D9A441'};
  const keySeries=keyIds.map(id=>({
    name:id, color:keyColors[id],
    pts:SESS.filter(s=>s.items && s.items.some(i=>i.id===id && i.load))
           .sort((a,b)=>a.ts-b.ts)
           .map(s=>({y:s.items.find(i=>i.id===id).load}))
  })).filter(s=>s.pts.length);

  const volBy={};
  SESS.filter(s=>s.kind==='s'&&s.volume).forEach(s=>{volBy[s.id]=(volBy[s.id]||0)+s.volume;});
  const volLabels=Object.keys(volBy), volValues=volLabels.map(k=>Math.round(volBy[k]/1000));

  const metSeries=[
    {name:'Peso',color:'#8E7BF0',pts:MET.filter(m=>m.peso).map(m=>({y:m.peso}))},
    {name:'BF %',color:'#2BB3B8',pts:MET.filter(m=>m.bf).map(m=>({y:m.bf}))},
    {name:'Muscolo',color:'#D9A441',pts:MET.filter(m=>m.musc).map(m=>({y:m.musc}))}
  ].filter(s=>s.pts.length);

  el.innerHTML=`
    <h2 class="head">Progressi</h2>
    <p class="sub">Aderenza, carichi e composizione corporea.</p>
    <div class="grid3">
      <div class="stat"><b>${SESS.length}</b><span>Sessioni</span></div>
      <div class="stat"><b>${thisWeek}<span style="font-size:14px;color:var(--muted)">/5</span></b><span>Questa sett.</span></div>
      <div class="stat"><b>${aderenza}%</b><span>Aderenza 4 sett.</span></div>
    </div>
    <div class="card">
      <h3>Carichi top · fondamentali</h3>
      <p class="cmeta">Carico della serie principale, sessione per sessione.</p>
      ${keySeries.length?lineChart(keySeries):'<div class="empty">Salva qualche sessione di forza con i carichi.</div>'}
      ${keySeries.length?`<div class="chkey">${keySeries.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`:''}
    </div>
    <div class="card">
      <h3>Volume per workout</h3>
      <p class="cmeta">Tonnellaggio cumulato, in migliaia di kg.</p>
      ${volValues.length?barChart(volLabels,volValues,'#8E7BF0'):'<div class="empty">Nessun volume registrato.</div>'}
    </div>
    <div class="card">
      <h3>Metriche corporee</h3>
      <div class="metin">
        <div><label for="m1">Peso (kg)</label><input class="load" id="m1" inputmode="decimal" placeholder="90.7"></div>
        <div><label for="m2">BF %</label><input class="load" id="m2" inputmode="decimal" placeholder="22"></div>
        <div><label for="m3">Muscolo (kg)</label><input class="load" id="m3" inputmode="decimal" placeholder="42.5"></div>
      </div>
      <button class="btn ghost" id="savemet" type="button">Registra metriche</button>
      ${metSeries.length?`<div style="margin-top:14px">${lineChart(metSeries,{dec:1})}<div class="chkey">${metSeries.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div></div>`:''}
    </div>`;

  $('#savemet').addEventListener('click',async()=>{
    const peso=parseFloat($('#m1').value)||null, bf=parseFloat($('#m2').value)||null, musc=parseFloat($('#m3').value)||null;
    if(!peso&&!bf&&!musc){ toast('Inserisci almeno un valore'); return; }
    MET.push({ts:Date.now(),peso,bf,musc});
    await store.set(K_MET,MET);
    toast('Metriche registrate'); renderProgressi();
  });
}

/* ---------- navigazione ---------- */
function setTab(t){
  tab=t;
  ['oggi','piano','storico','progressi'].forEach(x=>{ $('#tab-'+x).hidden = x!==t; });
  document.querySelectorAll('[role="tab"]').forEach(b=>b.setAttribute('aria-selected', b.dataset.tab===t));
  window.scrollTo({top:0,behavior:'smooth'});
}
document.querySelectorAll('[role="tab"]').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));

function setWeek(w){
  week=Math.min(13,Math.max(1,w)); planWeek=week;
  $('#wlbl').innerHTML=`W${week}/13<small>${PHASE_NAME[PHASE(week)]}</small>`;
  $('#wprev').disabled=week===1; $('#wnext').disabled=week===13;
  store.set(K_WEEK,week);
  renderOggi(); renderPiano();
}
$('#wprev').addEventListener('click',()=>setWeek(week-1));
$('#wnext').addEventListener('click',()=>setWeek(week+1));

(async function init(){
  SESS=(await store.get(K_SESS))||[];
  MET=(await store.get(K_MET))||[];
  setWeek((await store.get(K_WEEK))||1);
  renderStorico(); renderProgressi(); setTab('oggi');
})();
</script>
